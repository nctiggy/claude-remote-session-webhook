# gitleaks configuration.
#
# Ralph commits autonomously, so a human does not see every diff before it lands.
# On a public repo an accidental secret is harvested within minutes. This is the
# backstop for the custom secrets GitHub's own scanning does not know about.

[extend]
useDefault = true

[[rules]]
id = "crsw-shared-secret"
description = "CRSW HMAC shared secret assigned a real value"
# 32+ hex chars after the name. Both spellings, because since #65 the same
# setting is `CRSW_SHARED_SECRET` in a unit and `shared_secret` in a config
# file, and a rule that knew only the first would miss every leak from the
# format this project now tells operators to use. The empty assignment in
# config.example does not match either.
regex = '''(?i)(CRSW_)?SHARED_SECRET\s*[=:]\s*['"]?[0-9a-f]{32,}'''
tags = ["secret", "crsw"]

[[rules]]
id = "crsw-access-aud"
description = "Cloudflare Access AUD tag"
regex = '''(?i)(CRSW_)?ACCESS_AUD\s*[=:]\s*['"]?[0-9a-f]{40,}'''
tags = ["config", "crsw"]

[[rules]]
id = "cloudflare-tunnel-credentials"
description = "Cloudflare tunnel credentials JSON"
regex = '''"TunnelSecret"\s*:\s*"[A-Za-z0-9+/=]{40,}"'''
tags = ["secret", "cloudflare"]

[allowlist]
description = "Documentation and examples carry placeholders, not secrets"
paths = [
  '''^config\.example$''',
  '''^deploy/.*\.example\..*$''',
  '''^deploy/README\.md$''',
  '''^docs/.*\.md$''',
]
regexes = [
  # The all-zero tunnel ID used throughout the examples.
  '''00000000-0000-0000-0000-000000000000''',

  # Unsigned `alg: none` JWTs. These are test fixtures for the one attack layer 1
  # must refuse, and they are safe to allow *by construction* rather than by
  # assertion: the pattern requires the header to decode to {"alg":"none"} and the
  # signature segment to be empty, so a matching string authenticates nothing. A
  # real assertion — signed, RS256 — does not match and is still caught, including
  # inside a test file, which is the point of not allowlisting the path instead.
  '''eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]+\.$''',
]
