name: Claude — issue to PR

# Lane 3: label an issue `claude-fix`, a self-hosted runner picks it up, works
# under the SAME hooks and constitution as a human, and opens a reviewable PR.
#
# It never pushes to main. The output is always a PR.

# Lane 3, the working half. The queue half is claude-queue.yml.
#
# This must trigger on an `issues` event: the action refuses anything else with
# "Unsupported event type", which is what a push-triggered worker discovered the
# hard way (#61). So the scheduler picks the next issue and applies `claude-go`,
# and that label change is the event this waits for.
#
# `claude-fix` therefore means "in the queue" and `claude-go` means "work this
# one now". A human applies the first; only the scheduler applies the second.
on:
  issues:
    types: [labeled]

# One at a time across the whole repository, not per issue. The per-issue group
# this replaced meant twenty labelled issues were twenty simultaneous runs, each
# branching from main and each blind to the others.
#
# cancel-in-progress is false because a run in flight is doing real work — and
# because the hand-off label is applied to exactly one issue at a time, so there
# is nothing here for a second event to race with.
concurrency:
  group: claude-fix-worker
  cancel-in-progress: false

permissions:
  contents: write        # create the branch + commits
  pull-requests: write   # open the PR
  issues: write          # comment progress back on the issue

jobs:
  claude-fix:

    # SELF-HOSTED, as specified. Swap to `ubuntu-latest` to use GitHub-hosted
    # runners instead (free for public repos).
    runs-on: ubuntu-latest

    # Raised with the turn budget below. 80 turns that include `go test ./...`
    # and a full `golangci-lint run` will not reliably finish inside 30 minutes,
    # and a job killed by the clock looks identical to a job killed by the turn
    # cap — a failure mode this repo just spent three runs learning to read.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the agent can read context

      - name: Run Claude Code against the issue
        id: claude
                # Pinned to a commit SHA for the reason the model below is pinned: a tag
        # can be moved, and this action runs with write access to the repo.
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1.0.186
        with:
          # Subscription auth (Claude Pro/Max) — no API billing.
          # Generate on the runner (or any machine you are signed in on) with:
          #     claude setup-token
          # then store the value as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          #
          # To use pay-as-you-go API billing instead, swap this line for:
          #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Repo hooks apply to automated runs too. This is the whole point:
          # the runner inherits danger-guard and format-and-lint, so automation
          # cannot do anything a human contributor is forbidden from doing.
          settings: .claude/settings.json

          # Keep the agent bounded. A runaway loop on a runner is expensive
          # and produces an unreviewable diff.
          #
          # The turn budget was 25, and every one of the first three real issues
          # (#21, #22, #23) died on `Reached maximum number of turns (25)` having
          # produced nothing — no branch, no commit, and zero Edit/Write calls
          # across all three. The transcripts were 24 Bash, 23 Read, 3 Grep,
          # 3 Glob: the agent spent its entire budget on the reading this prompt
          # *requires* of it and was cut off before it could change a line.
          #
          # Raised again, 80 -> 250, on the same evidence as last time and a
          # sharper version of it. Every run since the split — #58, #59, #65 —
          # took 13 to 16 minutes and ended at the cap having produced real,
          # committed, partial work. Not one finished. A cap that no run has
          # ever reached the far side of is not a safety bound, it is the
          # thing deciding how much gets done.
          #
          # The cost of a cap is not the tokens it saves. Every capped run has
          # to be finished by hand, which costs more than the run did — so the
          # budget was buying nothing and charging twice.
          #
          # That is a budget bug, not a prompt bug. The prompt mandates three
          # document reads (AGENTS.md, the constitution, the matching docs/ file)
          # and "reproduce or precisely locate the problem before changing
          # anything" BEFORE any edit is permitted, then the four-command gate
          # after it, then fixes-log.md, then commit, push, and PR. Plus
          # track_progress, which spends turns updating the sticky comment.
          # That floor is 30-50 turns for a one-line CSS fix; 25 could not
          # buy the discipline this repo asks for. Lowering the discipline to
          # fit the budget would be the wrong repair.
          #
          # The model is pinned here rather than left to the action's default,
          # for the reason golangci-lint and Go are pinned: a default that moves
          # between action versions or subscription changes would quietly alter
          # how this automation reasons, with no commit to point at. On a repo
          # where a request that passes authentication is unsandboxed code
          # execution, "which model wrote this PR" belongs in the diff.
          #
          # It is NOT set in .claude/settings.json, which this step also passes.
          # That file governs interactive sessions too, and an operator switching
          # models by hand should not be fighting the automation's choice. The
          # action declares no `model` input, so it rides in claude_args as the
          # CLI flag it is.
          claude_args: --max-turns 250 --model claude-opus-5

          branch_prefix: claude/issue-
          # Both work again now that this triggers on an issues event. The
          # running commentary is how an operator sees what a run finished
          # before hitting its turn cap — every recovered run has been diagnosed
          # from it.
          track_progress: true
          use_sticky_comment: true

          prompt: |
            You are fixing a single GitHub issue in this repository.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ---
            ${{ github.event.issue.body }}
            ---

            Work in a bounded, Ralph-style way — but you get ONE pass, not a loop:

            1. Read AGENTS.md at the repo root. It is the contract.
            2. Read .specify/memory/constitution.md.
            3. Read the docs/ file matching this change (see the Progressive
               disclosure table in AGENTS.md). Do not read all of them.
            4. Reproduce or precisely locate the problem before changing anything.
            5. Make the SMALLEST correct change. Do not refactor adjacent code.
               Do not "improve" things you were not asked about.
            6. Run the build, test, and lint commands listed in AGENTS.md.
               They must pass. If you cannot make them pass, stop and explain
               in the PR description rather than forcing a green.
            7. If this qualifies as a quick fix, append one line to
               docs/fixes-log.md referencing issue #${{ github.event.issue.number }}.
            8. Open a pull request that closes the issue. The description must state:
               what was wrong, what you changed, and how you verified it.

            COMMIT AND PUSH AS YOU GO. Do not save the first commit for the end.
            The moment you have a coherent increment — the change itself, then each
            test, then the docs line — commit it and push the branch. A turn budget
            is a real bound and you may hit it: a pushed branch is then partial work
            somebody can finish, and an unpushed one is nothing at all. Issue #22
            cost eleven minutes of correct, gate-green work this way — the right
            diagnosis, the fix, and its unit tests, all discarded because the first
            commit had not happened yet.

            An incomplete branch is not a failure to hide. Push it, then say plainly
            in the PR (or the issue, if you never reached a PR) which numbered steps
            above you completed and which you did not. A partial PR clearly labelled
            is worth far more than a clean slate.

            Hard limits:
            - Never push to main. PR only.
            - Never commit a secret.
            - Never disable or bypass a hook in .claude/.
            - If the issue is ambiguous, do NOT guess. Open the PR as a draft and
              write the specific question under a "NEEDS CLARIFICATION" heading.

      # The agent cannot do this itself, and deliberately still cannot. Opening a
      # PR needs `gh pr create`, which is not on its allowlist; widening that
      # means editing .claude/settings.json, which the harness denies because an
      # agent must not be able to grant itself permissions (constitution V). The
      # #30 run verified both walls by walking into them rather than reasoning
      # about them, and reported the second one as the finding it was sent to fix.
      #
      # Note what is NOT here: `workflows: write`. Adding it would let a future
      # run edit this file — the one that decides what runs with write access to
      # the repo — and the agent's inability to touch it is the guardrail, not an
      # inconvenience to route around. Wiring the step from outside removes the
      # need without removing the wall.
      #
      # `if: always()` is the point rather than a detail: a run cut off by the
      # turn budget still leaves commits worth reading, and open-pr.sh opens
      # those as a *draft* so the auto-merge chain cannot carry half-finished
      # work to main on its own.
      - name: Open the pull request
        # always(), so a run cut off by the turn budget still surfaces its branch
        # as a draft — but only when there was an issue to work at all.
        if: always()
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/open-pr.sh

      # What the sticky comment used to say, said once at the end. Without this a
      # run that failed mid-task leaves nothing on the issue at all, and the
      # branch it pushed is the only evidence it ran — which is exactly the
      # situation #22, #42, #48 and #51 were each debugged out of by hand.
      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            if [ "$OUTCOME" = "success" ]; then
              echo "Worked this issue and finished. [Run]($RUN)"
            else
              echo "Worked this issue and did **not** finish (\`$OUTCOME\`). [Run]($RUN)"
              echo
              echo "Any commits it managed are on the branch below — a run that stops early still pushes what it completed, so this is partial work rather than none."
            fi
            if [ -n "${BRANCH}" ]; then
              echo
              echo "Branch: \`${BRANCH}\`"
            fi
          } | gh issue comment "$ISSUE" --repo "$REPO" --body-file -

      # Hand the queue back. Until this label is gone the scheduler will not
      # pick anything, which is the interlock that keeps one run at a time —
      # always(), because a run that failed must not wedge the queue behind it.
      - name: Release the hand-off label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --remove-label claude-go || true

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Claude issue automation"
            echo ""
            echo "- Issue: #${{ github.event.issue.number }}"
            echo "- Branch: ${{ steps.claude.outputs.branch_name || 'none created' }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
