name: Release start-project skill

# Publishes the start-project skill as installable release artifacts.
#
# Claude Code has no ".skill" file format — the distributable unit is a ZIP of the
# plugin directory, which `--plugin-url` fetches directly. See:
#   https://code.claude.com/docs/en/plugins
#
# Artifacts attached to the release:
#   start-project.zip  — installable bundle  (claude --plugin-url <url>)
#   SKILL.md           — human-readable, so the skill can be read without installing

on:
  push:
    tags: ['start-project-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. start-project-v1.0.0)'
        required: true

permissions:
  contents: write     # create the release and upload assets

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(python3 -c "import json;print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG, plugin version $VERSION"

      - name: Validate plugin structure
        run: |
          set -e
          # Dependency-free structural validation. `claude plugin validate` is the
          # authoritative check and is run before tagging; this guards the parts
          # that must hold for --plugin-url to work at all.
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('plugin')
          man = root / '.claude-plugin' / 'plugin.json'
          assert man.is_file(), 'missing .claude-plugin/plugin.json'
          m = json.loads(man.read_text())
          for field in ('name', 'description', 'version'):
              assert m.get(field), f'plugin.json missing {field}'
          skill = root / 'skills' / 'start-project' / 'SKILL.md'
          assert skill.is_file(), 'missing skills/start-project/SKILL.md'
          text = skill.read_text()
          assert text.startswith('---'), 'SKILL.md has no YAML frontmatter'
          fm = text.split('---')[1]
          for field in ('name:', 'description:'):
              assert field in fm, f'SKILL.md frontmatter missing {field}'
          # Skills load from the plugin root, never from inside .claude-plugin/
          assert not (root / '.claude-plugin' / 'skills').exists(), \
              'skills/ must be at the plugin root, not inside .claude-plugin/'
          lines = len(text.splitlines())
          assert lines < 500, f'SKILL.md is {lines} lines (guidance: under 500)'
          print(f"ok  {m['name']} v{m['version']}  SKILL.md {lines} lines")
          PY

      - name: Shell syntax of bundled scripts
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          for f in plugin/skills/start-project/scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning plugin/skills/start-project/scripts/*.sh
          echo "scripts clean"

      - name: Build the bundle
        run: |
          set -e
          mkdir -p dist staging
          cp -r plugin staging/start-project
          rm -rf staging/start-project/evals        # test cases are not shipped
          (cd staging && zip -qr ../dist/start-project.zip start-project)
          cp plugin/skills/start-project/SKILL.md dist/SKILL.md
          echo "--- bundle contents ---"
          unzip -l dist/start-project.zip
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG='${{ steps.meta.outputs.tag }}'
          VERSION='${{ steps.meta.outputs.version }}'
          NOTES=$(cat <<EOF
          Installable bundle for the \`start-project\` skill (plugin v${VERSION}).

          Bootstraps a new repo from this template: creates it on GitHub, fills every
          placeholder, enables the guardrails and free security features, optionally
          wires a design system, and hands back a repo ready for Spec Kit specs and
          Ralph loops.

          ## Use it without cloning anything

          \`\`\`bash
          claude --plugin-url https://github.com/${{ github.repository }}/releases/download/${TAG}/start-project.zip
          \`\`\`

          Then: \`/start-project:start-project\`

          ## Or install it permanently

          \`\`\`bash
          curl -sLO https://github.com/${{ github.repository }}/releases/download/${TAG}/start-project.zip
          unzip start-project.zip -d ~/.claude/skills/
          \`\`\`

          ## Assets

          | File | What it is |
          |---|---|
          | \`start-project.zip\` | The installable plugin bundle |
          | \`SKILL.md\` | The skill itself, readable without installing |

          Note: Claude Code has no \`.skill\` file format — a plugin ZIP is the
          distributable unit, and \`--plugin-url\` consumes it directly.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/start-project.zip dist/SKILL.md --clobber
          else
            gh release create "$TAG" dist/start-project.zip dist/SKILL.md \
              --title "start-project skill v${VERSION}" --notes "$NOTES"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
