name: CodeQL

# Static analysis, configured for Go. Free because this repo is public — one of the
# main reasons it is public. Given the daemon spawns unsandboxed sessions, the
# `security-and-quality` query suite is the minimum, not a nice-to-have.

on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'        # weekly, Monday 04:27 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write     # required to upload results to the Security tab
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
