name: CodeQL

# Static analysis. FREE for public repositories (a Code Security licence is only
# required for private repos).
#
# NOTE: this advanced workflow needs a language matrix. Until you pick a stack it
# runs on manual dispatch only, so a fresh template never fails red.
#
# Easiest path for most projects: skip this file entirely and turn on
#   Settings -> Code security -> Code scanning -> CodeQL analysis -> Default setup
# which auto-detects languages and needs no YAML at all.
#
# To use THIS file instead: fill in `language:` below and re-enable the triggers.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '27 4 * * 1'        # weekly, Monday 04:27 UTC
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read
  security-events: write     # required to upload results to the Security tab
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # <FILL IN> e.g. [javascript-typescript, python, go, ruby, java-kotlin, csharp, c-cpp, swift]
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
