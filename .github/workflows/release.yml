name: Release

# A release per merge to main, not per tag. Tag-only means a release happens
# when somebody remembers to tag, and self-update then has nothing to find —
# which for anyone downstream is the same as not shipping at all.
on:
  push:
    branches: [main]
  # For a publish that failed part-way. Re-running a commit that already has a
  # release fails on the duplicate tag, on purpose: the version is the commit
  # count, so a second release of the same commit would be one version naming
  # two different sets of bytes.
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

# One publish at a time, and never cancelled part-way: a cancelled run can leave
# a release created with some of its assets missing, which reads as a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # GitHub-hosted, unlike ci.yml. The self-hosted runners are the operator's
    # own machines, which also run unsandboxed Claude sessions — collapsing
    # those two trust boundaries is what docs/github-automation.md §2 refuses.
    # These bytes are the ones other people download and execute, so they are
    # built somewhere that holds nothing of his. A stall here delays a release
    # rather than blocking a merge, so #77's reason for leaving GitHub-hosted
    # runners does not reach this workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is the commit count, and actions/checkout defaults to a
          # depth of 1 — which counts 1. Without this every release is v0.1.
          fetch-depth: 0

      - name: Version
        id: version
        # Counted from the repository, not from github.run_number, which resets
        # when a workflow is recreated — an older release would then outrank a
        # newer one and break both "is this newer" and retention.
        run: |
          version="v0.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - uses: actions/setup-go@v7
        with:
          # Match ci.yml and the dev host. The three move together.
          go-version: '1.24'
          cache: true

      - name: Build linux/amd64 and linux/arm64
        env:
          # The artifact has to run where there is no compiler and no matching
          # libc. With cgo on, net and os/user resolve through the host's C
          # library and the binary links it dynamically — which works here on
          # the builder and fails on someone else's host, the only place the
          # answer matters.
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            # arm64 is cross-compiled on this same runner rather than built on a
            # second machine: without cgo, GOARCH is the whole difference.
            #
            # The -X path is spelled character for character in
            # cmd/crswd/version_test.go, and a test asserts the two agree. A
            # mistyped symbol is not an error — the linker sets nothing, the
            # "dev" default survives, and the release calls itself unreleased.
            GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/nctiggy/claude-remote-session-webhook/internal/buildinfo.Version=$VERSION" \
              -o "dist/$arch/crswd" ./cmd/crswd
            tar -C "dist/$arch" -czf "dist/crswd_${VERSION}_linux_${arch}.tar.gz" crswd
          done
          ls -l dist

      - name: Stage the deployment files
        # A release of the binary alone leaves the operator writing a unit file
        # by hand, which is the state this milestone exists to end. deploy/
        # already holds working, commented examples, so the release ships those
        # same bytes rather than a second copy that drifts from them.
        #
        # The unit is published under the name it is installed as: an asset
        # called crswd.example.service invites copying the word "example" into
        # ~/.config/systemd/user, and the installer writes crswd.service.
        run: |
          cp deploy/crswd.example.service dist/crswd.service
          cp deploy/cloudflared.example.yml dist/cloudflared.example.yml
          cp deploy/crswd-api dist/crswd-api
          ls -l dist

      - name: Checksum every asset
        # Every asset, not only the binaries. The tarballs read as "the release"
        # and the rest as documentation, but the deployment files are the ones
        # written into ~/.config/systemd/user and ~/.config/crswd — summing only
        # the binary verifies the half that was never in doubt.
        #
        # Taken from what dist/ holds rather than from the asset list typed out
        # a second time here. A second list is a list that drifts from the one
        # Publish uploads, and the asset it loses is the one that quietly stops
        # being checked.
        run: |
          cd dist
          # -maxdepth 1 -type f is the asset set exactly: the per-architecture
          # directories under dist/ are the tarballs' input, not something
          # anybody downloads.
          #
          # Bare names, because `sha256sum -c SHA256SUMS` is run from whatever
          # directory the assets were downloaded into, where dist/ does not
          # exist.
          sums=$(find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs -r sha256sum)
          # Written only once the sums are taken. A redirect would create the
          # file before find ran, so SHA256SUMS would appear in its own list,
          # holding the checksum of the empty file it was a moment earlier.
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "dist/crswd_${VERSION}_linux_amd64.tar.gz" \
            "dist/crswd_${VERSION}_linux_arm64.tar.gz" \
            "dist/crswd.service" \
            "dist/cloudflared.example.yml" \
            "dist/crswd-api" \
            "dist/SHA256SUMS"

      - name: Prune old releases
        # Bounded history, minus two refusals that pruning by age alone gets
        # wrong.
        #
        # The pointer is the one that matters. An installer downloads through
        # /releases/latest/download/<asset>, and `latest` is normally the newest
        # release but is not required to be — a prerelease, a draft, or a
        # release marked by hand moves it. A `latest` that 404s is worse than an
        # unbounded list: nothing is installable at all, and the person it
        # happens to has no way to tell that from the project being broken.
        #
        # Only what this workflow publishes is prunable: v0.<count>, the version
        # research.md R2 settled on. A tag in any other shape came from
        # somewhere else and is left where it is.
        env:
          GH_TOKEN: ${{ github.token }}
          # Declared here rather than written into the script below, so the
          # floor is provable: a test that cannot lower this cannot show that
          # the two most recent survive it being lowered.
          KEEP: "20"
        run: |
          # What the pointer resolves to, asked of GitHub rather than assumed to
          # be the highest number. `|| true` because a repository with no
          # release answers with an error, which is not a reason to fail.
          latest=$(gh release view --json tagName --jq '.tagName' || true)
          echo "latest resolves to ${latest:-nothing}"

          # Newest first by the number in the tag, not by the order the API
          # happens to answer in and not by date: the version is the commit
          # count, so the number is the ranking, and a re-published older
          # release carries today's date with yesterday's rank. Sorting the tags
          # as text is the same mistake mirrored — v0.9 outranks v0.30.
          tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          ordered=$(printf '%s\n' "$tags" | grep -E '^v0\.[0-9]+$' | sort -t. -k2,2nr || true)

          n=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            n=$((n + 1))

            # The two most recent survive whatever KEEP says. Redundant while it
            # is 20, and it is the rule that has to hold when somebody lowers it
            # in a hurry — a retention limit is exactly the knob that gets
            # turned down under pressure, and rolling back needs somewhere to
            # roll back to.
            if [ "$n" -le 2 ] || [ "$n" -le "$KEEP" ]; then
              continue
            fi
            if [ "$tag" = "$latest" ]; then
              echo "keeping $tag: the latest pointer still resolves to it"
              continue
            fi

            echo "pruning $tag"
            # The release, not the tag: --cleanup-tag would also delete the only
            # remaining record of which commit that version named.
            gh release delete "$tag" --yes
          done <<< "$ordered"
