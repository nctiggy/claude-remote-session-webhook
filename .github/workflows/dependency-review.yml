name: Dependency review

# Blocks a PR that introduces a vulnerable or badly-licensed dependency.
# Free because this repo is public.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    # Self-hosted (#77). GitHub-hosted runners stalled for six hours on
    # 2026-08-06 — checks queued at 16:37Z were still queued at 22:43Z — and
    # three verified branches could not merge because main requires checks that
    # were never going to run.
    #
    # These are crswd-runner-1/2 on the lab's VLAN 19, sharing hosts with the
    # nodewright and smart-gate-trigger runners. If they go offline, jobs
    # targeting them queue forever: the same failure this replaced, with a
    # different cause. Treat "runner offline" as an outage.
    #
    # The claude-fix lane deliberately stays on GitHub-hosted: it carries a
    # subscription token and runs an agent with write access, and it should not
    # share a machine with code from pull requests.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # This project is MIT and vendors almost nothing (see docs/security.md §5).
          # Copyleft would force a licence change, so it is refused outright.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
