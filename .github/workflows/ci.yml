name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Guardrails run on day one, before the project has picked a stack. They verify
  # the template's own contract: the hooks work, the context files exist, the
  # config parses. This job must stay green in a fresh clone.
  # ---------------------------------------------------------------------------
  guardrails:
    name: Template guardrails
    # Self-hosted (#77). GitHub-hosted runners stalled for six hours on
    # 2026-08-06 — checks queued at 16:37Z were still queued at 22:43Z — and
    # three verified branches could not merge because main requires checks that
    # were never going to run.
    #
    # These are crswd-runner-1/2 on the lab's VLAN 19, sharing hosts with the
    # nodewright and smart-gate-trigger runners. If they go offline, jobs
    # targeting them queue forever: the same failure this replaced, with a
    # different cause. Treat "runner offline" as an outage.
    #
    # The claude-fix lane deliberately stays on GitHub-hosted: it carries a
    # subscription token and runs an agent with write access, and it should not
    # share a machine with code from pull requests.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # gitleaks scans history, not just the tip

      - name: Required context files exist
        run: |
          set -e
          for f in AGENTS.md CLAUDE.md README.md \
                   docs/design-system.md docs/components.md \
                   docs/auth-and-sessions.md docs/security.md docs/fixes-log.md \
                   ralph/PROMPT.md ralph/IMPLEMENTATION_PLAN.md ralph/PROGRESS.md ralph/loop.sh \
                   .claude/settings.json .specify/memory/constitution.md; do
            [ -f "$f" ] || { echo "::error::missing required file: $f"; exit 1; }
          done
          echo "All required files present."

      - name: AGENTS.md stays skimmable (<150 lines)
        run: |
          lines=$(wc -l < AGENTS.md)
          echo "AGENTS.md is $lines lines"
          if [ "$lines" -ge 150 ]; then
            echo "::error::AGENTS.md is $lines lines (limit 150). Move detail into docs/ and link it."
            exit 1
          fi

      - name: Hooks are executable
        run: |
          set -e
          for h in .claude/hooks/*.sh ralph/loop.sh; do
            [ -x "$h" ] || { echo "::error::$h is not executable (chmod +x)"; exit 1; }
          done
          echo "All hooks executable."

      - name: Shell syntax
        run: |
          set -e
          for f in .claude/hooks/*.sh ralph/loop.sh; do
            sh -n "$f" 2>/dev/null || bash -n "$f"
          done
          echo "Shell syntax OK."

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning .claude/hooks/*.sh ralph/loop.sh .claude/statusline.sh .github/scripts/*.sh

      - name: Hook behaviour tests
        run: ./.claude/hooks/test-hooks.sh

      - name: actionlint (workflow validity)
        run: |
          curl -sL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint
          /tmp/actionlint

      - name: JSON / YAML parse
        run: |
          set -e
          python3 -c "import json;json.load(open('.claude/settings.json'))"
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit(0)  # yaml not present; workflow linting covers this anyway
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(p.read_text())
              print(f"ok {p}")
          PY

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|^secrets\.json$'; then
            echo "::error::secret-like file is tracked in git"
            exit 1
          fi
          echo "No secret-like files tracked."

      # Ralph commits autonomously and this repo is public, so nothing reaches
      # main unscanned. The .githooks/pre-commit hook is the local mirror of this;
      # this step is what actually enforces it.
      - name: gitleaks
        run: |
          # Deliberately newer than the distro package a developer is likely to
          # have (Ubuntu 24.04 ships 8.16). The skew runs in the safe direction:
          # CI has strictly more default rules, so it can only catch more than the
          # pre-commit hook, never less. The hook is a pre-filter; this is the
          # authority. Bump freely — it cannot make a local commit wrongly pass.
          VER=8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose

  # ---------------------------------------------------------------------------
  # Project checks. These are the commands from AGENTS.md — keep the two in sync.
  # Skipped until a stack is chosen, so a fresh template is green rather than red.
  # Delete the `if:` guard once you fill these in.
  # ---------------------------------------------------------------------------
  project:
    name: Build / test / lint
    runs-on: [self-hosted, linux, x64]
    needs: guardrails
    steps:
      - uses: actions/checkout@v7

      # hashFiles() is not available in a job-level `if`, so detect here and
      # gate the steps below. Until a stack exists these no-op instead of
      # failing a fresh clone.
      - name: Detect stack
        id: stack
        run: |
          # Must be an OR over individual files. `ls a b c d` exits non-zero if ANY
          # operand is missing, so the original form only reported "present" when
          # all four manifests existed — meaning it never fired, every Go step was
          # skipped, and this job reported green without building anything.
          if [ -f package.json ] || [ -f pyproject.toml ] || [ -f go.mod ] || [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Stack manifest found — running build/test/lint."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No stack manifest yet. Fill in the AGENTS.md commands and these steps."
          fi

      - uses: actions/setup-go@v7
        if: steps.stack.outputs.present == 'true'
        with:
          # Match the dev host. With CI older than local, a 1.24-only stdlib call
          # (crypto/rand.Text, testing/synctest) compiles locally and fails here —
          # skew in the unsafe direction. Keep these equal.
          go-version: '1.24'
          cache: true

      - name: Install
        if: steps.stack.outputs.present == 'true'
        run: go mod download


      - name: Lint
        if: steps.stack.outputs.present == 'true'
        # Pinned to a commit SHA, not a tag: a tag can be moved, which is what
        # CodeQL's actions/unpinned-tag rule is about. The tag it resolves to is
        # in the comment so a human can still read what this is.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # v2, because the action refuses v1 outright from v7 onward:
          # "golangci-lint v1 is not supported by golangci-lint-action >= v7".
          # .golangci.yml is the v2 schema to match; the two move together.
          version: v2.12.2

      - name: Typecheck
        if: steps.stack.outputs.present == 'true'
        run: go vet ./...

      - name: Test
        if: steps.stack.outputs.present == 'true'
        run: go test ./...

      # The two tagged suites (#87). Until now CI ran only the untagged tests,
      # so these two ran nowhere but on a developer's machine — and they rotted
      # there unseen: three cases were still asserting the pre-#63 world, where
      # a session did not survive the daemon that started it. A suite nothing
      # runs is worse than no suite, because it reads as coverage.
      #
      # They need a real tmux and a real binary, which is what they are for and
      # why they are tagged. The self-hosted runners have tmux; the `has` probe
      # in tmuxctl is what turns its absence into a skip rather than a failure,
      # so a runner without one reports honestly instead of going red.
      - name: Test (tmux)
        if: steps.stack.outputs.present == 'true'
        run: go test -tags tmux ./...

      - name: Test (quickstart)
        if: steps.stack.outputs.present == 'true'
        run: go test -tags quickstart ./...

      - name: Build
        if: steps.stack.outputs.present == 'true'
        run: go build ./...
